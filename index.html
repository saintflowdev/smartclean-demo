<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>SmartClean — заявка на уборку</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#0d1014;--text:#fff;--muted:#8b97a3;--main:#59a8f5;--main-dark:#8fcbff;--line:#222a32;--err:#ff8a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,Montserrat,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:8px 0 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--main);color:#fff;display:grid;place-items:center;font-size:20px}
.link{font:600 13px Montserrat,Montserrat,system-ui,sans-serif;color:var(--main-dark);text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:10px;background:var(--card)}
.lg{display:block;width:210px;max-width:60%;margin:0 auto 4px}
h1{font-size:28px;line-height:1.2;margin:8px 0 8px;font-weight:800;text-align:center}
.sub{color:var(--muted);margin:0 0 22px;text-align:center}
form,.result{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
label.l{display:block;font:600 14px Montserrat,system-ui,sans-serif;margin:0 0 6px}
.field{margin-bottom:16px}
input[type=text],input[type=number]{width:100%;font:17px Montserrat,system-ui,sans-serif;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:#000;color:var(--text)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--main);outline-offset:1px}
.svc{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font:16px Montserrat,system-ui,sans-serif;cursor:pointer}
.svc input{width:22px;height:22px;accent-color:var(--main);flex:none}
.svc .n{flex:1}
.svc small{display:block;color:var(--muted);font-size:13px}
.svc .p{font-weight:600;white-space:nowrap}
.err{color:var(--err);font:13px Montserrat,system-ui,sans-serif;min-height:18px;margin-top:4px}
.result{margin-top:14px}
.price{font-size:34px;font-weight:800;background:linear-gradient(90deg,#4a8fe0,#9bd4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.time{font:15px Montserrat,system-ui,sans-serif;color:var(--text)}
.hint{color:var(--muted);font:14px Montserrat,system-ui,sans-serif;margin-top:4px}
.btns{display:grid;gap:10px;margin-top:14px}
button{font:700 16px Montserrat,Montserrat,system-ui,sans-serif;padding:15px;border-radius:999px;border:1px solid var(--main);cursor:pointer}
.primary{background:linear-gradient(90deg,#4a8fe0,#8fcbff);color:#04121f;border-color:transparent}
.primary:hover:not(:disabled){filter:brightness(1.1)}
.second{background:transparent;color:var(--main-dark)}
button:disabled{opacity:.45;cursor:not-allowed}
footer{color:var(--muted);font:14px Montserrat,system-ui,sans-serif;padding:22px 0 8px;text-align:center}
.demo{font:12px Montserrat,system-ui,sans-serif;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>

  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <form id="form" novalidate>
    <div class="field">
      <label class="l" for="address">Адрес</label>
      <input type="text" id="address" autocomplete="street-address">
      <div class="err" id="eAddress"></div>
    </div>
    <div class="field">
      <label class="l" for="area">Площадь помещения, м²</label>
      <input type="number" id="area" min="1" inputmode="decimal" placeholder="Например, 54">
      <div class="err" id="eArea"></div>
    </div>
    <div class="field" style="margin-bottom:0">
      <label class="l">Что нужно сделать</label>
      <div id="services"></div>
      <div class="err" id="eSvc"></div>
      <label class="svc" style="border-top:1px solid var(--line)"><input type="checkbox" id="heavy"><span class="n">Сильные загрязнения<small>Менеджер учтёт это при расчёте</small></span></label>
    </div>
  </form>

  <div class="result">
    <div class="price" id="price"></div>
    <div class="time" id="time"></div>
    <div class="hint" id="priceHint"></div>
    <div class="btns">
      <button class="primary" id="send" type="button" disabled>Отправить заявку в Telegram</button>
      <button class="second" id="copy" type="button" disabled>Скопировать текст заявки</button>
    </div>
  </div>

  <footer id="footer"></footer>
  <div class="demo">Демо: услуги и цены из прайса SmartClean, контакты — заглушки</div>
</div>

<script>
// ===== Все данные компании — только здесь (в проекте это будет файл config.js) =====
const CONFIG = {
  companyName: "SmartClean",
  logoEmoji: "🧼",
  phone: "+7 (900) 000-00-00",        // ЗАМЕНИТЬ
  telegramUsername: "smartclean_demo", // ЗАМЕНИТЬ
  heroTitle: "Соберите уборку и узнайте цену",
  heroSubtitle: "Выберите услуги, укажите адрес и площадь — мы получим готовую заявку.",
  addressPlaceholder: "ул. Ленина, 25, кв. 12",
  services: [ // minutes — время, price — «от», ₽
    { id: "deep",    name: "Генеральная уборка",       minutes: 240, price: 3000 },
    { id: "kitchen", name: "Уборка кухни",             minutes: 180, price: 2250 },
    { id: "bath",    name: "Уборка ванной комнаты",    minutes: 90,  price: 1500 },
    { id: "wc",      name: "Мытьё санузла",            minutes: 90,  price: 1500 },
    { id: "fridge",  name: "Мытьё холодильника",       minutes: 30,  price: 700 },
    { id: "oven",    name: "Мытьё духовки",            minutes: 30,  price: 650 },
    { id: "micro",   name: "Мытьё микроволновой печи", minutes: 30,  price: 500 },
    { id: "hood",    name: "Мытьё вытяжки",            minutes: 30,  price: 500 },
    { id: "stove",   name: "Мытьё плиты",              minutes: 30,  price: 500 },
    { id: "windows", name: "Мытьё окон (за 1 окно)",   minutes: 30,  price: 500 }
  ],
  currency: "₽"
};
// ====================================================================================

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/\u00a0/g, " ");
const dur = m => { const h = Math.floor(m / 60), r = m % 60; return (h ? h + " ч" : "") + (h && r ? " " : "") + (r ? r + " мин" : ""); };

document.title = CONFIG.companyName + " — заявка на уборку";
$("title").textContent = CONFIG.heroTitle;
$("subtitle").textContent = CONFIG.heroSubtitle;
$("address").placeholder = CONFIG.addressPlaceholder;
$("footer").textContent = CONFIG.phone;
$("tgTop").href = "https://t.me/" + CONFIG.telegramUsername;

CONFIG.services.forEach(s => {
  const l = document.createElement("label");
  l.className = "svc";
  l.innerHTML = '<input type="checkbox" data-id="' + s.id + '"><span class="n">' + s.name + '<small>' + dur(s.minutes) + '</small></span><span class="p">от ' + fmt(s.price) + ' ' + CONFIG.currency + '</span>';
  $("services").appendChild(l);
});

let touched = { address: false, area: false };

function state() {
  const area = parseFloat($("area").value);
  const address = $("address").value.trim();
  const chosen = CONFIG.services.filter(s => document.querySelector('[data-id="' + s.id + '"]').checked);
  return {
    area, address, chosen, heavy: $("heavy").checked,
    areaOk: area > 0, addressOk: address.length > 0, svcOk: chosen.length > 0,
    price: chosen.reduce((a, s) => a + s.price, 0),
    minutes: chosen.reduce((a, s) => a + s.minutes, 0)
  };
}

function requestText(s) {
  const lines = [
    "Здравствуйте! Хочу заказать уборку.",
    "Адрес: " + s.address,
    "Площадь: " + s.area + " м²",
    "Услуги:"
  ];
  s.chosen.forEach(x => lines.push("- " + x.name + " (от " + fmt(x.price) + " " + CONFIG.currency + ")"));
  if (s.heavy) lines.push("Сильные загрязнения: да");
  lines.push("Ориентировочно: от " + fmt(s.price) + " " + CONFIG.currency + ", около " + dur(s.minutes));
  return lines.join("\n");
}

function render() {
  const s = state();
  $("eAddress").textContent = touched.address && !s.addressOk ? "Укажите адрес" : "";
  $("eArea").textContent = touched.area && !s.areaOk ? "Укажите площадь больше 0" : "";
  if (s.svcOk) {
    $("price").textContent = "от " + fmt(s.price) + " " + CONFIG.currency;
    $("time").textContent = "Время работы: около " + dur(s.minutes);
    $("priceHint").textContent = "Ориентировочная стоимость. Точную цену и время подтвердит менеджер.";
  } else {
    $("price").textContent = "—";
    $("time").textContent = "";
    $("priceHint").textContent = "Выберите хотя бы одну услугу";
  }
  const ok = s.addressOk && s.areaOk && s.svcOk;
  $("send").disabled = !ok;
  $("copy").disabled = !ok;
}

["address", "area"].forEach(id => $(id).addEventListener("blur", () => { touched[id] = true; render(); }));
$("form").addEventListener("input", render);
$("form").addEventListener("change", render);

$("send").addEventListener("click", () => {
  window.open("https://t.me/" + CONFIG.telegramUsername + "?text=" + encodeURIComponent(requestText(state())), "_blank", "noopener");
});

$("copy").addEventListener("click", async () => {
  const text = requestText(state());
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }
  $("copy").textContent = "Скопировано";
  setTimeout(() => $("copy").textContent = "Скопировать текст заявки", 1800);
});

render();
</script>
</body>
</html>
